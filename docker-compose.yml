# AI Provider OS — Opção B Docker — 1 comando — SEM Rust — FIX volume bug
# Uso: docker compose up --build
# Frontend: http://localhost:3000 — Backend: http://localhost:8000 — Docs: http://localhost:8000/docs
# FIX CRÍTICO: antes backend_storage:/app/ai_provider_os.db montava volume (diretório) em caminho de arquivo → criava diretório não arquivo → DB falhava
# Agora: backend_db:/app/data + DATABASE_URL sqlite:////app/data/ai_provider_os.db — volume em diretório, não arquivo

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=auto-generated-dev-key-32-chars-minimum-change-prod
      - DATABASE_URL=sqlite:////app/data/ai_provider_os.db
      - CORS_ORIGINS=*
      # Opcional: adicione suas keys no .env na raiz — funciona SEM keys (ovhcloud free 2 RPM)
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - CEREBRAS_API_KEY=${CEREBRAS_API_KEY:-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - HF_TOKEN=${HF_TOKEN:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - COHERE_API_KEY=${COHERE_API_KEY:-}
    volumes:
      # Persistência DB — volume em diretório /app/data, não em arquivo — FIX CRÍTICO
      - backend_db:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend_db:
